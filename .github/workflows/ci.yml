name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
          python-version: "3.15"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked mypy .
      - run: uv run --locked python -m unittest ChatPeek_test -v

  check-links:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
          python-version: "3.15"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked check_fixture_links.py

  publish:
    needs: test
    if: >-
      github.repository == 'LoicE5/ChatPeek' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"
      - id: version
        shell: bash
        run: |
          version="$(uv version --short)"
          test "$version" = '1.1.0'
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          tags: |
            ghcr.io/loice5/chatpeek:${{ steps.version.outputs.version }}
            ghcr.io/loice5/chatpeek:latest

  release:
    needs: publish
    if: >-
      github.repository == 'LoicE5/ChatPeek' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Create version tag and release from changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
        shell: bash
        run: |
          tag="v$RELEASE_VERSION"
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v version="$RELEASE_VERSION" '
            $0 == "## " version { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$notes"
          test -n "$(tr -d '[:space:]' < "$notes")"
          if gh release view "$tag" > /dev/null 2>&1; then
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file "$notes"
